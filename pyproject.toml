[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-ml-algorithms"
version = "0.1.0"
description = "Vectorized Machine Learning algorithms built from scratch using NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.ruff]
line-length = 117

[tool.ruff.lint]
select = ["E", "F", "N"]
ignore = [
    "N803",
    "N806",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["\\.venv/"]
files = ["custom_ml", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q --cov=custom_ml --cov-report=term-missing"